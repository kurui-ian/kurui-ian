name: Connect Four Game

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: connect4-game
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'connect4|') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Connect 4 Move
        env:
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_USER_LOGIN: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/play_connect4.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md connect4_games/game.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(game): update Connect 4 board for ${{ github.event.issue.title || 'manual trigger' }}" && git push)
